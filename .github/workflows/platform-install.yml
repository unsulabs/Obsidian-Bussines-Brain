name: Platform installation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CI_EVIDENCE: ${{ runner.temp }}/platform-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install using README instructions (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3.11 -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements.txt
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
      - name: Install using README instructions (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          py -3.11 -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . .venv\Scripts\Activate.ps1
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:VIRTUAL_ENV\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Full unittest suite (strict skip policy)
        run: python scripts/verify_platform.py tests --output "${{ env.CI_EVIDENCE }}"
      - name: Synthetic installation and export audit
        if: ${{ !cancelled() }}
        run: python scripts/verify_platform.py installation --output "${{ env.CI_EVIDENCE }}"
      - name: Upload synthetic verification evidence only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-${{ matrix.os }}-python-3.11
          path: |
            ${{ env.CI_EVIDENCE }}/tests.log
            ${{ env.CI_EVIDENCE }}/tests.json
            ${{ env.CI_EVIDENCE }}/installation.json
          if-no-files-found: error
          retention-days: 14
